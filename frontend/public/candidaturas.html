<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Candidaturas</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: #ffffff; --white-hover: rgba(26,39,68,0.06); --white-border: rgba(26,39,68,0.1); --text-muted: #6b7a99; }
    body { font-family: 'Inter', sans-serif; background: #f5f7fc; color: #1a2744; min-height: 100vh; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .topbar, body.high-contrast .cand-card { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast .status-badge { background: #ff0 !important; color: #000 !important; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: #ffffff; box-shadow: 0 1px 6px rgba(26,39,68,0.08); border-bottom: 1px solid rgba(26,39,68,0.1); position: sticky; top: 0; z-index: 99; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #1a2744; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .btn-ghost:hover { background: rgba(26,39,68,0.06); }

    .container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }

    .list { display: flex; flex-direction: column; gap: 12px; }

    .cand-card { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 14px; padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; transition: 0.2s; }
    .cand-card:hover { background: var(--white-hover); }

    .cand-info h2 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .cand-info p { font-size: 13px; color: var(--text-muted); }

    .status-badge { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; background: rgba(244,124,32,0.18); color: var(--orange); border: 1px solid rgba(244,124,32,0.3); white-space: nowrap; flex-shrink: 0; }

    .progress { display: flex; align-items: center; gap: 0; margin-top: 12px; }
    .step-item { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
    .step-item:not(:last-child)::after { content: ''; position: absolute; top: 10px; left: 50%; width: 100%; height: 2px; background: rgba(26,39,68,0.12); z-index: 0; }
    .step-item.done:not(:last-child)::after { background: #f47c20; }
    .step-dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(26,39,68,0.1); border: 2px solid rgba(26,39,68,0.15); position: relative; z-index: 1; }
    .step-item.done .step-dot { background: #f47c20; border-color: #f47c20; }
    .step-item.current .step-dot { background: #fff; border-color: #f47c20; box-shadow: 0 0 0 3px rgba(244,124,32,0.3); }
    .step-label { font-size: 10px; color: rgba(26,39,68,0.4); margin-top: 5px; text-align: center; }
    .step-item.done .step-label, .step-item.current .step-label { color: #1a2744; }
    .vaga-status-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .vaga-aberta { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .vaga-encerrada { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
  </style>
</head>
<body>
  

  <div class="container">
    <div class="page-label">Histórico</div>
    <h1>Minhas candidaturas</h1>
    <p class="sub">Acompanhe o status das suas inscrições</p>

    <div class="list" id="lista-candidaturas">
      <p style="color:#6b7a99;font-size:14px">Carregando...</p>
    </div>

    <a href="home.html" class="back">← Voltar para Home</a>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="config.js"></script>
  <script src="topbar.js"></script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }

    async function carregarCandidaturas() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = 'login.html'; return; }
      const lista = document.getElementById('lista-candidaturas');
      try {
        const r = await fetch(API_URL + "/inscricoes/minhas", { headers: {'Authorization':'Bearer '+token} });
        const d = await r.json();
        if (!r.ok) { lista.innerHTML = '<p style="color:#6b7a99;font-size:14px">Erro ao carregar.</p>'; return; }
        if (!d.length) { lista.innerHTML = '<p style="color:#6b7a99;font-size:14px">Você ainda não se candidatou a nenhuma vaga.</p>'; return; }
        const STEPS = ['Pendente','Em análise','Entrevista','Aprovado'];
        const statusCores = { 'Aprovado':'#4ade80','Reprovado':'#f87171','Entrevista':'#60a5fa','Em análise':'#f59e0b','Pendente':'#94a3b8' };

        function buildProgress(status) {
          if (status === 'Reprovado') return `<p style="font-size:11px;color:#f87171;margin-top:10px">❌ Candidatura reprovada</p>`;
          return `<div class="progress">${STEPS.map((s,i) => {
            const idx = STEPS.indexOf(status);
            const cls = i < idx ? 'done' : i === idx ? 'current' : '';
            return `<div class="step-item ${cls}"><div class="step-dot"></div><div class="step-label">${s}</div></div>`;
          }).join('')}</div>`;
        }

        lista.innerHTML = d.map(i => `
          <div class="cand-card" style="flex-direction:column;align-items:stretch">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
              <div class="cand-info">
                <h2>${i.vaga_titulo || 'Vaga'}</h2>
                <p>${i.empresa_nome || ''}</p>
                <p style="margin-top:4px">Inscrito em ${new Date(i.data_inscricao).toLocaleDateString('pt-BR')}</p>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                <span class="status-badge" style="background:${statusCores[i.status]||'rgba(244,124,32,0.18)'}22;color:${statusCores[i.status]||'#f47c20'};border-color:${statusCores[i.status]||'rgba(244,124,32,0.3)'}44">${i.status||'Pendente'}</span>
                ${i.vaga_status ? `<span class="vaga-status-badge ${i.vaga_status==='Aberta'?'vaga-aberta':'vaga-encerrada'}">${i.vaga_status}</span>` : ''}
              </div>
            </div>
            ${buildProgress(i.status)}
          </div>`).join('');
      } catch(e) { lista.innerHTML = '<p style="color:#6b7a99;font-size:14px">Não foi possível conectar ao servidor.</p>'; }
    }
    carregarCandidaturas();
  </script>
</body>
</html>
