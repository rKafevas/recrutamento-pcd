<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Candidaturas</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-hover: rgba(255,255,255,0.16); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .topbar, body.high-contrast .cand-card { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast .status-badge { background: #ff0 !important; color: #000 !important; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); position: sticky; top: 0; z-index: 99; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }

    .container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }

    .list { display: flex; flex-direction: column; gap: 12px; }

    .cand-card { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 14px; padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; transition: 0.2s; }
    .cand-card:hover { background: var(--white-hover); }

    .cand-info h2 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .cand-info p { font-size: 13px; color: var(--text-muted); }

    .status-badge { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; background: rgba(244,124,32,0.18); color: var(--orange); border: 1px solid rgba(244,124,32,0.3); white-space: nowrap; flex-shrink: 0; }

    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-top: 28px; transition: 0.2s; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <button class="btn-ghost" onclick="toggleContrast()">Alto Contraste</button>
  </div>

  <div class="container">
    <div class="page-label">Histórico</div>
    <h1>Minhas candidaturas</h1>
    <p class="sub">Acompanhe o status das suas inscrições</p>

    <div class="list" id="lista-candidaturas">
      <p style="color:rgba(255,255,255,0.6);font-size:14px">Carregando...</p>
    </div>

    <a href="home.html" class="back">← Voltar para Home</a>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }

    async function carregarCandidaturas() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = 'login.html'; return; }
      const lista = document.getElementById('lista-candidaturas');
      try {
        const r = await fetch('http://localhost:3000/inscricoes/minhas', { headers: {'Authorization':'Bearer '+token} });
        const d = await r.json();
        if (!r.ok) { lista.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px">Erro ao carregar.</p>'; return; }
        if (!d.length) { lista.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px">Você ainda não se candidatou a nenhuma vaga.</p>'; return; }
        lista.innerHTML = d.map(i => `
          <div class="cand-card">
            <div class="cand-info">
              <h2>${i.vaga?.titulo || 'Vaga'}</h2>
              <p>${i.vaga?.empresa || ''} ${i.vaga?.local ? '· ' + i.vaga.local : ''}</p>
              <p style="margin-top:4px">Inscrito em ${new Date(i.createdAt||i.data_inscricao).toLocaleDateString('pt-BR')}</p>
            </div>
            <span class="status-badge">${i.status || 'Em análise'}</span>
          </div>`).join('');
      } catch(e) { lista.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px">Não foi possível conectar ao servidor.</p>'; }
    }
    carregarCandidaturas();
  </script>
</body>
</html>
