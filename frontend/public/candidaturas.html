<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Minhas Candidaturas</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height: 100vh;

      background: linear-gradient(135deg, #114ea8, #1e74df);

      color: white;

      transition: 0.3s;
    }

    /* ALTO CONTRASTE */

    body.high-contrast{
      background: black;
      color: yellow;
    }

    body.high-contrast .topbar,
    body.high-contrast .vaga-card{
      background: #111;
      border: 2px solid yellow;
    }

    body.high-contrast .contrast-btn{
      color: yellow;
      border-color: yellow;
    }

    body.high-contrast .status{
      background: yellow;
      color: black;
    }

    /* TOPO */

    .topbar{

      width: 100%;
      height: 70px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 25px;

      background: rgba(255,255,255,0.08);

      backdrop-filter: blur(5px);

      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .logo{
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo img{
      width: 45px;
      height: 45px;

      border-radius: 10px;
      object-fit: cover;
    }

    .logo h2{
      font-size: 22px;
    }

    .contrast-btn{

      padding: 10px 18px;

      border-radius: 30px;

      border: 2px solid rgba(255,255,255,0.7);

      background: transparent;

      color: white;

      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    /* CONTAINER */

    .container{
      padding: 35px 25px;
    }

    .title{
      margin-bottom: 30px;
    }

    .title h1{
      font-size: 34px;
      margin-bottom: 10px;
    }

    .title p{
      opacity: 0.9;
      font-size: 16px;
    }

    /* LISTA */

    .vagas{
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .vaga-card{

      background: rgba(255,255,255,0.12);

      border-radius: 20px;

      padding: 24px;

      backdrop-filter: blur(5px);

      transition: 0.3s;
    }

    .vaga-card:hover{
      transform: translateY(-3px);
      background: rgba(255,255,255,0.18);
    }

    .vaga-card h2{
      font-size: 24px;
      margin-bottom: 10px;
    }

    .empresa{
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .descricao{
      line-height: 24px;
      margin-bottom: 18px;
    }

    /* STATUS */

    .status{

      display: inline-block;

      padding: 8px 16px;

      border-radius: 30px;

      background: #ff8400;

      font-size: 14px;
      font-weight: bold;
    }

    /* VOLTAR */

    .back{

      display: inline-block;

      margin-top: 35px;

      color: white;

      text-decoration: none;

      font-size: 18px;
      font-weight: bold;
    }

    .back:hover{
      text-decoration: underline;
    }

    /* VLIBRAS */

    .vw-access-button{
      right: 15px !important;
      top: 50% !important;
      transform: translateY(-50%);
    }

    /* RESPONSIVO */

    @media(max-width: 700px){

      .topbar{
        flex-direction: column;
        height: auto;
        gap: 15px;
        padding: 15px;
      }

      .title h1{
        font-size: 28px;
      }

      .vaga-card h2{
        font-size: 20px;
      }

    }

  </style>
</head>

<body>

  <!-- TOPO -->

  <div class="topbar">

    <div class="logo">

      <img src="logo.png.jpeg" alt="Logo Inclui+">

      <h2>Inclui+</h2>

    </div>

    <button class="contrast-btn" onclick="toggleContrast()">
      🌙 Alto Contraste
    </button>

  </div>

  <!-- CONTAINER -->

  <div class="container">

    <!-- TITULO -->

    <div class="title">

      <h1>📌 Minhas candidaturas</h1>

      <p>
        Veja as vagas em que você já se candidatou
      </p>

    </div>

    <!-- VAGAS -->

    <div class="vagas" id="lista-candidaturas">
      <p style="opacity:0.8">Carregando candidaturas...</p>
    </div>

    <!-- VOLTAR -->

    <a href="home.html" class="back">
      ← Voltar para Home
    </a>

  </div>

  <!-- VLIBRAS -->

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>

    new window.VLibras.Widget('https://vlibras.gov.br/app');

    function toggleContrast(){
      document.body.classList.toggle("high-contrast");
    }

    async function carregarCandidaturas() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const lista = document.getElementById('lista-candidaturas');

      try {
        const resposta = await fetch('http://localhost:3000/inscricoes/minhas', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          lista.innerHTML = '<p>Erro ao carregar candidaturas.</p>';
          return;
        }

        if (!resultado.length) {
          lista.innerHTML = '<p style="opacity:0.8">Você ainda não se candidatou a nenhuma vaga.</p>';
          return;
        }

        lista.innerHTML = resultado.map(item => `
          <div class="vaga-card">
            <h2>${item.vaga?.titulo || 'Vaga'}</h2>
            <p class="empresa">📍 ${item.vaga?.local || ''} | ${item.vaga?.empresa || ''}</p>
            <p class="descricao">Candidatura realizada em ${new Date(item.createdAt || item.data_inscricao).toLocaleDateString('pt-BR')}.</p>
            <span class="status">${item.status || 'Em análise'}</span>
          </div>
        `).join('');

      } catch (e) {
        lista.innerHTML = '<p>Não foi possível conectar ao servidor.</p>';
      }
    }

    carregarCandidaturas();

  </script>

</body>
</html>
