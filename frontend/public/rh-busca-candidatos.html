<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Banco de Talentos</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; padding-bottom: 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); position: sticky; top: 0; z-index: 99; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
    .container { max-width: 860px; margin: 0 auto; padding: 40px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    .search-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .search-row input, .search-row select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 10px 14px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; }
    .search-row input { flex: 1; min-width: 200px; }
    .search-row input::placeholder { color: rgba(255,255,255,0.35); }
    .search-row select option { background: #1250b0; }
    .btn-primary { background: var(--orange); border: none; color: #fff; padding: 10px 20px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .lista { display: flex; flex-direction: column; gap: 12px; }
    .cand-card { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 14px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; transition: 0.2s; }
    .cand-card:hover { background: rgba(255,255,255,0.14); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid var(--white-border); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex: 1; }
    .info h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .info p { font-size: 13px; color: var(--text-muted); }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(244,124,32,0.15); color: var(--orange); border: 1px solid rgba(244,124,32,0.3); margin-top: 5px; display: inline-block; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-sm { background: rgba(255,255,255,0.1); border: 1px solid var(--white-border); color: #fff; padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
    .btn-sm:hover { background: rgba(255,255,255,0.16); }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-top: 28px; }
    .back:hover { color: #fff; }
    .empty { text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <a href="login.html" class="btn-ghost">Sair</a>
  </div>

  <div class="container">
    <div class="page-label">Recursos Humanos</div>
    <h1>Banco de Talentos</h1>
    <p class="sub">Busque candidatos PcD cadastrados na plataforma</p>

    <div class="search-row">
      <input type="text" id="busca" placeholder="Buscar por nome ou e-mail...">
      <select id="deficiencia">
        <option value="">Todas as deficiências</option>
        <option value="Física">Física</option>
        <option value="Auditiva">Auditiva</option>
        <option value="Visual">Visual</option>
        <option value="Intelectual">Intelectual</option>
        <option value="Múltipla">Múltipla</option>
      </select>
      <button class="btn-primary" onclick="buscar()">Buscar</button>
    </div>

    <div class="lista" id="lista">
      <div class="empty">Use os filtros acima para buscar candidatos.</div>
    </div>

    <a href="rh-dashboard.html" class="back">← Voltar ao Painel</a>
  </div>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function buscar() {
      const busca = document.getElementById('busca').value;
      const deficiencia = document.getElementById('deficiencia').value;
      const params = new URLSearchParams();
      if (busca) params.append('busca', busca);
      if (deficiencia) params.append('deficiencia', deficiencia);
      const lista = document.getElementById('lista');
      lista.innerHTML = '<div class="empty">Buscando...</div>';
      try {
        const r = await fetch(API_URL + '/candidatos/busca?' + params, { headers: {'Authorization':'Bearer '+token} });
        const d = await r.json();
        if (!d.length) { lista.innerHTML = '<div class="empty">Nenhum candidato encontrado.</div>'; return; }
        lista.innerHTML = d.map(c => `
          <div class="cand-card">
            <div class="avatar">
              ${c.foto_url
                ? `<img src="${fileUrl(c.foto_url)}">`
                : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`}
            </div>
            <div class="info">
              <h3>${c.nome_completo || 'Candidato'}</h3>
              <p>${c.email}</p>
              ${c.tipo_deficiencia ? `<span class="badge">${c.tipo_deficiencia}</span>` : ''}
              ${c.habilidades ? `<p style="margin-top:6px;font-size:12px;color:rgba(255,255,255,0.5)">${c.habilidades.substring(0,80)}${c.habilidades.length>80?'...':''}</p>` : ''}
            </div>
            <div class="actions">
              ${c.curriculo_url ? `<a href="${fileUrl(c.curriculo_url)}" target="_blank" class="btn-sm">Currículo</a>` : ''}
            </div>
          </div>`).join('');
      } catch(e) { lista.innerHTML = '<div class="empty">Erro de conexão.</div>'; }
    }

    document.getElementById('busca').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
    buscar();
  </script>
</body>
</html>
