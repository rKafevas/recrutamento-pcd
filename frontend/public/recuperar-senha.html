<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Recuperar Senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 400px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 36px 32px; backdrop-filter: blur(12px); }
    .icon { width: 56px; height: 56px; background: rgba(244,124,32,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .icon svg { width: 26px; height: 26px; stroke: #f47c20; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .sub { font-size: 14px; color: rgba(255,255,255,0.65); text-align: center; margin-bottom: 28px; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field input { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 11px 14px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; transition: 0.2s; }
    .field input::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus { outline: none; border-color: rgba(255,255,255,0.45); }
    .field input.codigo { letter-spacing: 6px; text-align: center; font-size: 20px; }
    .btn { width: 100%; height: 46px; background: #f47c20; border: none; color: #fff; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn:hover { background: #e06b10; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.6); text-decoration: none; }
    .back:hover { color: #fff; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <div class="card">

    <!-- STEP 1: E-mail -->
    <div class="step active" id="step1">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h1>Recuperar senha</h1>
      <p class="sub">Digite o e-mail cadastrado na sua conta e enviaremos um código de verificação.</p>
      <div class="field"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com"></div>
      <button class="btn" onclick="solicitarCodigo()">Enviar código</button>
      <a href="login.html" class="back">← Voltar para o login</a>
    </div>

    <!-- STEP 2: Código -->
    <div class="step" id="step2">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
      <h1>Verifique seu e-mail</h1>
      <p class="sub" id="sub-step2">Enviamos um código de 6 dígitos. Digite-o abaixo.</p>
      <div class="field"><label>Código de verificação</label><input type="text" id="codigo" class="codigo" placeholder="000000" maxlength="6"></div>
      <button class="btn" onclick="verificarCodigo()">Verificar código</button>
      <a href="#" class="back" onclick="voltarStep(1)">← Usar outro e-mail</a>
    </div>

    <!-- STEP 3: Nova senha -->
    <div class="step" id="step3">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <h1>Nova senha</h1>
      <p class="sub">Crie uma nova senha para sua conta.</p>
      <div class="field"><label>Nova senha</label><input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres"></div>
      <div class="field"><label>Confirmar senha</label><input type="password" id="confirmar-senha" placeholder="Repita a nova senha"></div>
      <button class="btn" onclick="redefinirSenha()">Salvar nova senha</button>
    </div>

  </div>

  <script>
    let usuarioId = null;
    let codigoValido = null;

    function voltarStep(n) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + n).classList.add('active');
    }

    async function solicitarCodigo() {
      const email = document.getElementById('email').value.trim();
      if (!email) { alert('Digite seu e-mail.'); return; }
      try {
        const r = await fetch(API_URL + "/recuperar-senha', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email })
        });
        const d = await r.json();
        usuarioId = d.usuario_id;
        document.getElementById('sub-step2').textContent = `Enviamos um código para ${email}. Digite-o abaixo.`;
        voltarStep(2);
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }

    async function verificarCodigo() {
      const codigo = document.getElementById('codigo').value.trim();
      if (codigo.length !== 6) { alert('Digite o código de 6 dígitos.'); return; }
      try {
        const r = await fetch(API_URL + "/recuperar-senha/verificar', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ usuario_id: usuarioId, token: codigo })
        });
        const d = await r.json();
        if (r.ok) { codigoValido = codigo; voltarStep(3); }
        else alert('Erro: ' + (d.mensagem || 'Código inválido.'));
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }

    async function redefinirSenha() {
      const nova = document.getElementById('nova-senha').value;
      const confirmar = document.getElementById('confirmar-senha').value;
      if (nova.length < 6) { alert('A senha deve ter no mínimo 6 caracteres.'); return; }
      if (nova !== confirmar) { alert('As senhas não coincidem.'); return; }
      try {
        const r = await fetch(API_URL + "/recuperar-senha/redefinir', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ usuario_id: usuarioId, token: codigoValido, nova_senha: nova })
        });
        const d = await r.json();
        if (r.ok) { alert('Senha redefinida com sucesso!'); window.location.href = 'login.html'; }
        else alert('Erro: ' + (d.mensagem || 'Tente novamente.'));
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }
  </script>
</body>
</html>
