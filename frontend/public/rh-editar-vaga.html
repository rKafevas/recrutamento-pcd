<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Editar Vaga</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --orange-hover: #e06b10; --white-soft: rgba(255,255,255,0.08); --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; padding-bottom: 60px; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .topbar, body.high-contrast .panel { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast input, body.high-contrast textarea, body.high-contrast select { background: #fff !important; color: #000 !important; }
    body.high-contrast .btn-primary { background: #ff0 !important; color: #000 !important; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); position: sticky; top: 0; z-index: 99; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
    .btn-ghost:hover { background: var(--white-soft); }

    .container { max-width: 760px; margin: 0 auto; padding: 40px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 36px; }

    .panel { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 16px; padding: 28px; margin-bottom: 16px; }
    .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--white-border); }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field label span { color: var(--orange); margin-left: 2px; }
    .field input, .field textarea, .field select { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; padding: 11px 14px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; transition: 0.2s; }
    .field input::placeholder, .field textarea::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.12); }
    .field textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
    .field select option { background: #1250b0; color: #fff; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

    .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
    .btn-primary { background: var(--orange); border: none; color: #fff; padding: 12px 28px; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: var(--orange-hover); }

    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-bottom: 28px; transition: 0.2s; }
    .back:hover { color: #fff; }

    @media(max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .topbar { padding: 14px 20px; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <div style="display:flex;gap:10px">
      <button class="btn-ghost" onclick="toggleContrast()">Alto Contraste</button>
      <a href="login.html" class="btn-ghost">Sair</a>
    </div>
  </div>

  <div class="container">
    <a href="rh-dashboard.html" class="back">← Voltar ao Painel</a>

    <div class="page-label">Recursos Humanos</div>
    <h1>Editar vaga</h1>
    <p class="sub">Atualize as informações da vaga. Campos marcados com <span style="color:var(--orange)">*</span> são obrigatórios.</p>

    <div class="panel">
      <div class="panel-title">Informações básicas</div>
      <div class="field"><label>Título <span>*</span></label><input type="text" id="titulo"></div>
      <div class="field"><label>Descrição <span>*</span></label><textarea id="descricao"></textarea></div>
      <div class="field"><label>Requisitos <span>*</span></label><textarea id="requisitos"></textarea></div>
      <div class="field"><label>Benefícios</label><textarea id="beneficios" style="min-height:80px"></textarea></div>
      <div class="grid-2">
        <div class="field"><label>Modelo de trabalho <span>*</span></label>
          <select id="modelo_trabalho">
            <option value="Presencial">Presencial</option>
            <option value="Híbrido">Híbrido</option>
            <option value="Remoto">Remoto</option>
          </select>
        </div>
        <div class="field"><label>Localização <span>*</span></label><input type="text" id="localizacao"></div>
      </div>
      <div class="field"><label>Salário</label><input type="text" id="salario"></div>
    </div>

    <div class="panel">
      <div class="panel-title">Inclusão e acessibilidade</div>
      <div class="field"><label>Foco de deficiência <span>*</span></label>
        <select id="tipo_deficiencia_foco">
          <option value="Qualquer">Qualquer deficiência</option>
          <option value="Física">Física</option>
          <option value="Auditiva">Auditiva</option>
          <option value="Visual">Visual</option>
          <option value="Intelectual">Intelectual</option>
          <option value="Múltipla">Múltipla</option>
        </select>
      </div>
      <div class="field"><label>Acessibilidade no local</label><textarea id="acessibilidade_local" style="min-height:80px"></textarea></div>
      <div class="field"><label>Tecnologias assistivas</label><textarea id="tecnologias_assistivas" style="min-height:80px"></textarea></div>
    </div>

    <div class="actions">
      <a href="rh-dashboard.html" class="btn-ghost">Cancelar</a>
      <button class="btn-primary" onclick="salvarEdicao()">Salvar alterações</button>
    </div>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }

    const params = new URLSearchParams(window.location.search);
    const vagaId = params.get('vaga_id');

    function preencher(v) {
      document.getElementById('titulo').value = v.titulo || '';
      document.getElementById('descricao').value = v.descricao || '';
      document.getElementById('requisitos').value = v.requisitos || '';
      document.getElementById('beneficios').value = v.beneficios || '';
      document.getElementById('modelo_trabalho').value = v.modelo_trabalho || 'Presencial';
      document.getElementById('localizacao').value = v.localizacao || '';
      document.getElementById('salario').value = v.salario || '';
      document.getElementById('tipo_deficiencia_foco').value = v.tipo_deficiencia_foco || 'Qualquer';
      document.getElementById('acessibilidade_local').value = v.acessibilidade_local || '';
      document.getElementById('tecnologias_assistivas').value = v.tecnologias_assistivas || '';
    }

    async function carregarVaga() {
      if (!vagaId) { alert('Vaga não identificada.'); window.location.href = 'rh-dashboard.html'; return; }
      try {
        const r = await fetch(`http://localhost:3000/vagas`);
        const d = await r.json();
        const vaga = d.find(v => v.id == vagaId);
        if (vaga) preencher(vaga);
        else { alert('Vaga não encontrada.'); window.location.href = 'rh-dashboard.html'; }
      } catch(e) { alert('Erro ao carregar vaga.'); }
    }

    async function salvarEdicao() {
      const token = localStorage.getItem('token');
      const dados = {
        titulo: document.getElementById('titulo').value,
        descricao: document.getElementById('descricao').value,
        requisitos: document.getElementById('requisitos').value,
        beneficios: document.getElementById('beneficios').value,
        modelo_trabalho: document.getElementById('modelo_trabalho').value,
        localizacao: document.getElementById('localizacao').value,
        salario: document.getElementById('salario').value,
        tipo_deficiencia_foco: document.getElementById('tipo_deficiencia_foco').value,
        acessibilidade_local: document.getElementById('acessibilidade_local').value,
        tecnologias_assistivas: document.getElementById('tecnologias_assistivas').value
      };

      if (!dados.titulo || !dados.descricao || !dados.requisitos || !dados.modelo_trabalho || !dados.localizacao) {
        alert('Preencha todos os campos obrigatórios (*).');
        return;
      }

      try {
        const r = await fetch(`http://localhost:3000/vagas/${vagaId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(dados)
        });
        const d = await r.json();
        if (r.ok) { alert('Vaga atualizada com sucesso!'); window.location.href = 'rh-dashboard.html'; }
        else { alert('Erro: ' + (d.mensagem || 'Tente novamente.')); }
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }

    carregarVaga();
  </script>
</body>
</html>
