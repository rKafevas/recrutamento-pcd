<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Perfil do Candidato</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; padding-bottom: 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
    .container { max-width: 700px; margin: 0 auto; padding: 40px 24px; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-bottom: 28px; }
    .back:hover { color: #fff; }
    .perfil-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid var(--white-border); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar svg { width: 32px; height: 32px; stroke: rgba(255,255,255,0.4); fill: none; stroke-width: 1.5; }
    .perfil-header-info h1 { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .perfil-header-info p { font-size: 14px; color: var(--text-muted); }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(244,124,32,0.15); color: var(--orange); border: 1px solid rgba(244,124,32,0.3); margin-top: 6px; }
    .panel { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 14px; padding: 22px; margin-bottom: 14px; }
    .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
    .info-row { display: flex; gap: 8px; font-size: 14px; margin-bottom: 10px; align-items: flex-start; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: var(--text-muted); min-width: 130px; flex-shrink: 0; }
    .info-value { color: #fff; line-height: 1.5; }
    .doc-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--orange); text-decoration: none; padding: 7px 14px; border: 1px solid rgba(244,124,32,0.3); border-radius: 8px; background: rgba(244,124,32,0.08); transition: 0.2s; }
    .doc-link:hover { background: rgba(244,124,32,0.15); }
    .doc-link.blue { color: #60a5fa; border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.08); }
    .doc-link.blue:hover { background: rgba(96,165,250,0.15); }
    .docs { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-primary { background: var(--orange); border: none; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <a href="login.html" class="btn-ghost">Sair</a>
  </div>

  <div class="container">
    <a id="btn-voltar" href="rh-dashboard.html" class="back">← Voltar</a>

    <div id="conteudo"><p style="color:var(--text-muted);font-size:14px">Carregando perfil...</p></div>
  </div>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const params = new URLSearchParams(window.location.search);
    const inscricaoId = params.get('inscricao');
    const vagaId = params.get('vaga');
    if (vagaId) document.getElementById('btn-voltar').href = `rh-candidatos.html?vaga_id=${vagaId}`;

    async function carregarPerfil() {
      try {
        const r = await fetch(`${API_URL}/mensagens/inscricao/${inscricaoId}/dados`, { headers: {'Authorization':'Bearer '+token} });
        const d = await r.json();

        // Busca perfil completo do candidato
        const r2 = await fetch(`${API_URL}/candidatos/${d.candidato_id}`, { headers: {'Authorization':'Bearer '+token} });
        const c = await r2.json();

        document.getElementById('conteudo').innerHTML = `
          <div class="perfil-header">
            <div class="avatar">
              ${c.foto_url
                ? `<img src="${fileUrl(c.foto_url)}" alt="Foto">`
                : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`}
            </div>
            <div class="perfil-header-info">
              <h1>${c.nome_completo || 'Candidato'}</h1>
              <p>${c.email || ''}</p>
              ${c.tipo_deficiencia ? `<span class="badge">${c.tipo_deficiencia}</span>` : ''}
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">Informações de contato</div>
            <div class="info-row"><span class="info-label">E-mail</span><span class="info-value">${c.email || '—'}</span></div>
            <div class="info-row"><span class="info-label">Telefone</span><span class="info-value">${c.telefone || '—'}</span></div>
          </div>

          ${c.sobre ? `<div class="panel"><div class="panel-title">Sobre o candidato</div><p style="font-size:14px;line-height:1.7;color:rgba(255,255,255,0.85)">${c.sobre}</p></div>` : ''}
          ${c.formacao ? `<div class="panel"><div class="panel-title">Formação acadêmica</div><p style="font-size:14px;line-height:1.7;white-space:pre-wrap;color:rgba(255,255,255,0.85)">${c.formacao}</p></div>` : ''}
          ${c.experiencias ? `<div class="panel"><div class="panel-title">Experiências profissionais</div><p style="font-size:14px;line-height:1.7;white-space:pre-wrap;color:rgba(255,255,255,0.85)">${c.experiencias}</p></div>` : ''}
          ${c.habilidades ? `<div class="panel"><div class="panel-title">Habilidades</div><p style="font-size:14px;line-height:1.7;color:rgba(255,255,255,0.85)">${c.habilidades}</p></div>` : ''}

          <div class="panel">
            <div class="panel-title">Deficiência e acessibilidade</div>
            <div class="info-row"><span class="info-label">Tipo de deficiência</span><span class="info-value">${c.tipo_deficiencia || '—'}</span></div>
            <div class="info-row"><span class="info-label">Necessidades</span><span class="info-value">${c.necessidades_acessibilidade || '—'}</span></div>
          </div>

          <div class="panel">
            <div class="panel-title">Documentos</div>
            <div class="docs">
              ${c.curriculo_url
                ? `<a href="${fileUrl(c.curriculo_url)}" target="_blank" class="doc-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Ver currículo</a>`
                : '<p style="font-size:13px;color:rgba(255,255,255,0.4)">Currículo não enviado</p>'}
              ${c.laudo_medico_url
                ? `<a href="${fileUrl(c.laudo_medico_url)}" target="_blank" class="doc-link blue">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    Ver laudo médico</a>`
                : '<p style="font-size:13px;color:rgba(255,255,255,0.4)">Laudo não enviado</p>'}
            </div>
          </div>

          <a href="chat.html?inscricao=${inscricaoId}" class="btn-primary">Enviar mensagem</a>
        `;
      } catch(e) { document.getElementById('conteudo').innerHTML = '<p style="color:rgba(255,255,255,0.5)">Erro ao carregar perfil.</p>'; }
    }

    carregarPerfil();
  </script>
</body>
</html>
