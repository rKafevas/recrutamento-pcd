<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Mensagens</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: rgba(13,59,142,0.7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 7px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }

    .chat-layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: 300px; border-right: 1px solid var(--white-border); display: flex; flex-direction: column; flex-shrink: 0; background: rgba(0,0,0,0.1); }
    .sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); padding: 16px 18px 12px; border-bottom: 1px solid var(--white-border); }
    .conversas { overflow-y: auto; flex: 1; }
    .conversa-item { padding: 14px 18px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06); transition: 0.2s; }
    .conversa-item:hover { background: rgba(255,255,255,0.08); }
    .conversa-item.active { background: rgba(255,255,255,0.13); border-left: 3px solid var(--orange); }
    .conversa-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; justify-content: space-between; }
    .conversa-item p { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge-nao-lida { background: var(--orange); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }

    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { padding: 16px 22px; border-bottom: 1px solid var(--white-border); background: rgba(255,255,255,0.05); flex-shrink: 0; }
    .chat-header h3 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; }
    .chat-header p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    .mensagens { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrap { display: flex; flex-direction: column; }
    .msg-wrap.enviada { align-items: flex-end; }
    .msg-wrap.recebida { align-items: flex-start; }
    .msg-remetente { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; padding: 0 4px; }
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg.enviada { background: var(--orange); border-bottom-right-radius: 4px; }
    .msg.recebida { background: rgba(255,255,255,0.13); border: 1px solid var(--white-border); border-bottom-left-radius: 4px; }
    .msg-hora { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; padding: 0 4px; }

    .chat-input { padding: 14px 20px; border-top: 1px solid var(--white-border); display: flex; gap: 10px; flex-shrink: 0; background: rgba(0,0,0,0.1); }
    .chat-input input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 11px 16px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; }
    .chat-input input::placeholder { color: rgba(255,255,255,0.35); }
    .chat-input input:focus { outline: none; border-color: rgba(255,255,255,0.4); }
    .btn-enviar { background: var(--orange); border: none; color: #fff; padding: 11px 22px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn-enviar:hover { background: #e06b10; }

    .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 10px; }
    .empty-chat p { font-size: 14px; }
    .empty-sidebar { padding: 16px 18px; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <a id="btn-voltar" href="home.html" class="btn-ghost">← Voltar</a>
  </div>

  <div class="chat-layout">
    <div class="sidebar">
      <div class="sidebar-title">Conversas</div>
      <div class="conversas" id="lista-conversas">
        <div class="empty-sidebar">Carregando...</div>
      </div>
    </div>
    <div class="chat-area" id="chat-area">
      <div class="empty-chat">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Selecione uma conversa para começar</p>
      </div>
    </div>
  </div>

  <script src="" + API_URL + "/socket.io/socket.io.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = 'login.html'; }

    // Decodifica o token para pegar id e tipo
    const payload = JSON.parse(atob(token.split('.')[1]));
    const meuId = payload.id;
    const meuTipo = payload.tipo;

    // Ajusta botão voltar por tipo
    document.getElementById('btn-voltar').href = meuTipo === 'RH' ? 'rh-dashboard.html' : 'home.html';

    const socket = io('" + API_URL + "', { auth: { token } });
    let inscricaoAtual = null;
    let destinatarioAtual = null;

    // Recebe nova mensagem em tempo real
    socket.on('nova_mensagem', (msg) => {
      if (String(msg.inscricao_id) === String(inscricaoAtual)) {
        // Só renderiza se não for do próprio usuário (evita duplicata)
        if (msg.remetente_id != meuId) {
          renderMensagem(msg);
          scrollBottom();
        }
      }
      carregarConversas();
    });

    // Carrega lista de conversas
    async function carregarConversas() {
      const r = await fetch(API_URL + "/mensagens/conversas', { headers: {'Authorization':'Bearer '+token} });
      const d = await r.json();
      const lista = document.getElementById('lista-conversas');

      if (!d.length) {
        lista.innerHTML = '<div class="empty-sidebar">Nenhuma conversa ainda.</div>';
        return;
      }

      lista.innerHTML = d.map(c => `
        <div class="conversa-item ${String(c.inscricao_id) === String(inscricaoAtual) ? 'active' : ''}"
          onclick="abrirConversa(${c.inscricao_id})">
          <h4>
            ${meuTipo === 'RH' ? c.candidato_nome : c.vaga_titulo}
            ${c.nao_lidas > 0 ? `<span class="badge-nao-lida">${c.nao_lidas}</span>` : ''}
          </h4>
          <p>${meuTipo === 'RH' ? c.vaga_titulo : c.candidato_nome} · ${c.ultima_mensagem || ''}</p>
        </div>`).join('');
    }

    // Abre uma conversa
    async function abrirConversa(inscricaoId) {
      inscricaoAtual = inscricaoId;

      // Atualiza active na sidebar
      document.querySelectorAll('.conversa-item').forEach(el => el.classList.remove('active'));
      event?.currentTarget?.classList.add('active');

      socket.emit('entrar_sala', inscricaoId);

      // Busca dados da inscrição (para saber quem é o destinatário)
      const rdados = await fetch(`${API_URL}/mensagens/inscricao/${inscricaoId}/dados`, { headers: {'Authorization':'Bearer '+token} });
      const dados = await rdados.json();

      destinatarioAtual = meuTipo === 'RH' ? dados.candidato_usuario_id : dados.rh_usuario_id;

      const nomeOutro = meuTipo === 'RH' ? dados.candidato_nome : 'RH';

      // Busca mensagens
      const r = await fetch(`${API_URL}/mensagens/${inscricaoId}`, { headers: {'Authorization':'Bearer '+token} });
      const msgs = await r.json();

      document.getElementById('chat-area').innerHTML = `
        <div class="chat-header">
          <h3>${dados.vaga_titulo}</h3>
          <p>${nomeOutro}</p>
        </div>
        <div class="mensagens" id="msgs-container">
          ${msgs.length ? msgs.map(m => buildMsg(m)).join('') : '<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:13px;margin-top:20px">Nenhuma mensagem ainda. Seja o primeiro a enviar!</div>'}
        </div>
        <div class="chat-input">
          <input type="text" id="input-msg" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter') enviarMsg()">
          <button class="btn-enviar" onclick="enviarMsg()">Enviar</button>
        </div>`;
      scrollBottom();
    }

    function buildMsg(m) {
      const meu = m.remetente_id == meuId;
      const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
      return `<div class="msg-wrap ${meu ? 'enviada' : 'recebida'}">
        ${!meu ? `<div class="msg-remetente">${m.remetente_email || 'Outro'}</div>` : ''}
        <div class="msg ${meu ? 'enviada' : 'recebida'}">${m.conteudo}</div>
        <div class="msg-hora">${hora}</div>
      </div>`;
    }

    function renderMensagem(msg) {
      const container = document.getElementById('msgs-container');
      if (!container) return;
      // Remove aviso de "nenhuma mensagem" se existir
      const aviso = container.querySelector('div[style]');
      if (aviso) aviso.remove();
      container.insertAdjacentHTML('beforeend', buildMsg(msg));
    }

    function enviarMsg() {
      const input = document.getElementById('input-msg');
      const conteudo = input?.value?.trim();
      if (!conteudo || !inscricaoAtual || !destinatarioAtual) return;

      // Renderiza imediatamente sem esperar o socket
      const agora = new Date().toISOString();
      renderMensagem({ remetente_id: meuId, conteudo, criado_em: agora, inscricao_id: inscricaoAtual });
      scrollBottom();

      socket.emit('enviar_mensagem', { inscricaoId: inscricaoAtual, destinatarioId: destinatarioAtual, conteudo });
      input.value = '';
    }

    function scrollBottom() {
      setTimeout(() => {
        const c = document.getElementById('msgs-container');
        if (c) c.scrollTop = c.scrollHeight;
      }, 50);
    }

    // Verifica se veio com parâmetro ?inscricao=ID na URL
    const params = new URLSearchParams(window.location.search);
    const inscricaoParam = params.get('inscricao');

    carregarConversas().then(() => {
      if (inscricaoParam) abrirConversa(inscricaoParam);
    });
  </script>
</body>
</html>
