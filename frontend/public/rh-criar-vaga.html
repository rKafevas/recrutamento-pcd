<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Nova Vaga</title>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #f47c20;
      --orange-hover: #e06b10;
      --white-soft: rgba(255,255,255,0.08);
      --white-med: rgba(255,255,255,0.10);
      --white-border: rgba(255,255,255,0.15);
      --text-muted: rgba(255,255,255,0.65);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    body.high-contrast {
      background: #000 !important;
      color: #ff0 !important;
    }

    body.high-contrast .topbar,
    body.high-contrast .panel {
      background: #111 !important;
      border: 2px solid #ff0 !important;
    }

    body.high-contrast input,
    body.high-contrast textarea,
    body.high-contrast select {
      background: #fff !important;
      color: #000 !important;
    }

    body.high-contrast .btn-primary {
      background: #ff0 !important;
      color: #000 !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: rgba(13,59,142,0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--white-border);
      position: sticky;
      top: 0;
      z-index: 99;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--white-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .panel {
      background: var(--white-med);
      border: 1px solid var(--white-border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 16px;
    }

    .field { margin-bottom: 18px; }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .btn-primary {
      background: var(--orange);
      border: none;
      padding: 12px 28px;
      border-radius: 9px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--orange-hover); }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">
      <img src="logo.png.jpeg" alt="Inclui+">
      <span>Inclui+</span>
    </div>

    <div>
      <button class="btn-ghost" onclick="toggleContrast()">Alto Contraste</button>
      <a href="login.html" class="btn-ghost">Sair</a>
    </div>
  </div>

  <div class="container">
    <h1>Publicar nova vaga</h1>

    <div class="panel">

      <div class="field">
        <label>Título *</label>
        <input id="titulo">
      </div>

      <div class="field">
        <label>Descrição *</label>
        <textarea id="descricao"></textarea>
      </div>

      <div class="field">
        <label>Requisitos *</label>
        <textarea id="requisitos"></textarea>
      </div>

      <div class="field">
        <label>Modelo de trabalho *</label>
        <select id="modelo_trabalho">
          <option value="">Selecione</option>
          <option>Presencial</option>
          <option>Híbrido</option>
          <option>Remoto</option>
        </select>
      </div>

      <div class="field">
        <label>Localização *</label>
        <input id="localizacao">
      </div>

      <div class="field">
        <label>Foco deficiência *</label>
        <select id="tipo_deficiencia_foco">
          <option value="">Selecione</option>
          <option>Qualquer</option>
          <option>Física</option>
          <option>Auditiva</option>
          <option>Visual</option>
          <option>Intelectual</option>
          <option>Múltipla</option>
        </select>
      </div>

    </div>

    <button class="btn-primary" onclick="criarVaga()">Publicar vaga</button>
  </div>

  <script src="config.js"></script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (window.VLibras) {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
      }
    });

    function toggleContrast() {
      document.body.classList.toggle('high-contrast');
    }

    async function criarVaga() {
      try {
        const token = localStorage.getItem('token');
        if (!token) return (window.location.href = 'login.html');

        const payload = {
          titulo: document.getElementById('titulo').value,
          descricao: document.getElementById('descricao').value,
          requisitos: document.getElementById('requisitos').value,
          modelo_trabalho: document.getElementById('modelo_trabalho').value,
          localizacao: document.getElementById('localizacao').value,
          tipo_deficiencia_foco: document.getElementById('tipo_deficiencia_foco').value
        };

        if (!Object.values(payload).every(v => v)) {
          alert("Preencha todos os campos obrigatórios.");
          return;
        }

        const response = await fetch(`${API_URL}/vagas`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        let data = {};
        try {
          data = await response.json();
        } catch {}

        if (response.ok) {
          alert("Vaga publicada com sucesso!");
          window.location.href = "rh-dashboard.html";
        } else {
          alert(data.mensagem || "Erro ao criar vaga");
        }

      } catch (err) {
        console.error(err);
        alert("Erro de conexão com o servidor.");
      }
    }
  </script>

</body>
</html>
