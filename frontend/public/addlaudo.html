<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Adicionar Laudo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .topbar, body.high-contrast .panel { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast .btn-primary { background: #ff0 !important; color: #000 !important; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }

    .container { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }

    .panel { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 16px; padding: 28px; margin-bottom: 20px; }

    .file-area { border: 1px dashed rgba(255,255,255,0.25); border-radius: 10px; padding: 32px; text-align: center; }
    .file-icon { width: 48px; height: 48px; background: rgba(244,124,32,0.12); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .file-icon svg { width: 22px; height: 22px; stroke: var(--orange); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .file-area h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .file-area p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .file-area input { color: rgba(255,255,255,0.7); font-size: 13px; }

    .btn-primary { background: var(--orange); border: none; color: #fff; padding: 12px 24px; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #e06b10; }

    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-top: 20px; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <button class="btn-ghost" onclick="toggleContrast()">Alto Contraste</button>
  </div>

  <div class="container">
    <div class="page-label">Documentação</div>
    <h1>Adicionar laudo</h1>
    <p class="sub">Envie seu laudo médico em PDF para validação na plataforma.</p>

    <div class="panel">
      <div class="file-area">
        <div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <h3>Selecione o arquivo</h3>
        <p>Formato aceito: PDF</p>
        <input type="file" accept=".pdf">
      </div>
    </div>

    <button class="btn-primary" onclick="enviarLaudo()">Enviar laudo</button>
    <br>
    <a href="home.html" class="back">← Voltar para Home</a>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }
    async function enviarLaudo() {
      const arquivo = document.querySelector('input[type="file"]').files[0];
      if (!arquivo) { alert('Selecione um arquivo PDF.'); return; }
      const token = localStorage.getItem('token');
      if (!token) { alert('Você precisa estar logado.'); window.location.href = 'login.html'; return; }
      const formData = new FormData();
      formData.append('laudo', arquivo);
      try {
        const r = await fetch('http://localhost:3000/perfil/laudo', { method: 'PATCH', headers: {'Authorization':'Bearer '+token}, body: formData });
        const d = await r.json();
        alert(r.ok ? 'Laudo enviado com sucesso!' : 'Erro: ' + (d.mensagem || 'Tente novamente.'));
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }
  </script>
</body>
</html>
