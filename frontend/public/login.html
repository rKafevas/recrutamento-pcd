<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ Login</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg, #114ea8, #1e74df);

      overflow: hidden;
      position: relative;

      transition: 0.3s;
    }

    /* MODO ALTO CONTRASTE */

    body.high-contrast{
      background: black;
    }

    body.high-contrast .login-card{
      background: #111;
      border: 2px solid yellow;
    }

    body.high-contrast input{
      background: white;
      color: black;
    }

    body.high-contrast .subtitle,
    body.high-contrast label,
    body.high-contrast .register,
    body.high-contrast .forgot,
    body.high-contrast .contrast-btn{
      color: yellow;
    }

    body.high-contrast .login-btn{
      background: yellow;
      color: black;
    }

    /* BOTÃO CONTRASTE */

    .contrast-btn{
      position: absolute;
      top: 18px;
      right: 18px;

      padding: 10px 22px;

      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.8);

      background: transparent;
      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    .contrast-btn:hover{
      background: rgba(255,255,255,0.1);
    }

    /* CARD LOGIN */

    .login-card{

      width: 330px;

      background: rgba(255,255,255,0.15);

      border-radius: 20px;

      padding: 35px 30px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.15);

      backdrop-filter: blur(5px);

      color: white;

      transition: 0.3s;
    }

    /* LOGO */

    .logo-box{

      width: 145px;
      height: 145px;

      margin: 0 auto 18px;

      background: #f5f5f5;

      border-radius: 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .logo-box img{
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .subtitle{
      text-align: center;
      font-size: 15px;
      margin-bottom: 25px;
    }

    /* INPUTS */

    .input-group{
      margin-bottom: 18px;
    }

    .input-group label{
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: bold;
    }

    .input-group input{

      width: 100%;
      height: 42px;

      border: none;
      border-radius: 10px;

      background: #e9edf2;

      padding: 0 14px;

      font-size: 15px;
    }

    .input-group input:focus{
      outline: none;
    }

    /* SENHA */

    .password-box{
      position: relative;
    }

    .password-box i{

      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      color: #666;
      font-style: normal;

      cursor: pointer;
    }

    /* OPTIONS */

    .options{

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 28px;

      font-size: 13px;
    }

    .remember{
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .forgot{
      color: #ffb347;
      font-weight: bold;
    }

    /* BOTÃO */

    .login-btn{

      width: 100%;
      height: 48px;

      border: none;
      border-radius: 12px;

      background: #ff8400;

      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    .login-btn:hover{
      background: #ff9500;
      transform: scale(1.01);
    }

    /* REGISTER */

    .register{

      margin-top: 22px;

      text-align: center;

      font-size: 15px;
      font-weight: bold;
    }

    .register a{
      color: #ffb347;
    }

    /* VLIBRAS */

    .vw-access-button{
      right: 15px !important;
      top: 50% !important;
      transform: translateY(-50%);
    }

    /* RESPONSIVO */

    @media(max-width: 500px){

      .login-card{
        width: 90%;
        padding: 30px 25px;
      }

      .logo-box{
        width: 120px;
        height: 120px;
      }

    }

  </style>
</head>

<body>

  <!-- BOTÃO CONTRASTE -->

  <button class="contrast-btn" onclick="toggleContrast()">
    🌙 Alto Contraste
  </button>

  <!-- CARD -->

  <div class="login-card">

    <!-- LOGO -->

    <div class="logo-box">

      <!-- SUA IMAGEM -->
      <img src="logo.png.jpeg" alt="Logo Inclui+">

    </div>

    <p class="subtitle">
      Plataforma inclusiva da UNINASSAU
    </p>

    <!-- FORM -->

    <form>

      <div class="input-group">

        <label>Email</label>

        <input 
          type="email"
          placeholder="Digite seu email"
        >

      </div>

      <div class="input-group">

        <label>Senha</label>

        <div class="password-box">

          <input 
            type="password"
            placeholder="Digite sua senha"
          >

          <i>👁</i>

        </div>

      </div>

      <!-- OPTIONS -->

      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Lembrar-me
        </label>

        <a href="#" class="forgot">
          Esqueci a senha
        </a>

      </div>

      <!-- BOTÃO -->

            <button 
        class="login-btn"
        type="button"
        onclick="executarLogin()"
        >
        Entrar
        </button>

      <!-- REGISTER -->

      <p class="register">
        Não tem conta?
        <a href="cadastro.html">
          Criar conta
        </a>
      </p>

    </form>

  </div>

  <!-- VLIBRAS -->

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    function toggleContrast(){
      document.body.classList.toggle("high-contrast");
    }

    async function executarLogin() {
      const email = document.querySelector('input[type="email"]').value;
      const senha = document.querySelector('input[type="password"]').value;

      if (!email || !senha) {
        alert('Preencha o email e a senha.');
        return;
      }

      try {
        const resposta = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          localStorage.setItem('token', resultado.token);
          localStorage.setItem('tipo', resultado.tipo || '');
          localStorage.setItem('nome', resultado.nome || '');
          window.location.href = 'home.html';
        } else {
          alert('Erro: ' + (resultado.mensagem || 'Credenciais inválidas.'));
        }
      } catch (e) {
        alert('Não foi possível conectar ao servidor. Verifique se o backend está rodando.');
      }
    }
  </script>

</body>
</html>
