<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f7fc; color: #1a2744; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .card { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast input { background: #fff !important; color: #000 !important; }
    body.high-contrast .btn-primary { background: #ff0 !important; color: #000 !important; }

    .contrast-top { position: absolute; top: 16px; right: 16px; background: transparent; border: 1px solid rgba(26,39,68,0.2); color: #1a2744; padding: 8px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; }

    .card { width: 100%; max-width: 380px; background: #ffffff; border: 1px solid rgba(26,39,68,0.1); border-radius: 18px; padding: 36px 32px; box-shadow: 0 4px 24px rgba(26,39,68,0.08); }

    .brand { text-align: center; margin-bottom: 28px; }
    .brand img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; margin-bottom: 12px; }
    .brand h1 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .brand p { font-size: 13px; color: #6b7a99; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field input { width: 100%; height: 44px; background: #f8f9fd; border: 1px solid rgba(26,39,68,0.14); border-radius: 9px; padding: 0 14px; font-size: 14px; color: #1a2744; transition: 0.2s; }
    .field input::placeholder { color: rgba(26,39,68,0.4); }
    .field input:focus { outline: none; border-color: #1e74df; background: #ffffff; }

    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
    .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #1a2744; }
    .row a { color: #f47c20; text-decoration: none; }

    .btn-primary { width: 100%; height: 46px; background: #f47c20; border: none; border-radius: 9px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #e06b10; }

    .register { margin-top: 20px; text-align: center; font-size: 13px; color: #6b7a99; }
    .register a { color: #f47c20; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <button class="contrast-top" onclick="toggleContrast()">Alto Contraste</button>

  <div class="card">
    <div class="brand">
      <img src="logo.png.jpeg" alt="Inclui+">
      <h1>Inclui+</h1>
      <p>Plataforma inclusiva da UNINASSAU</p>
    </div>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••">
    </div>

    <div class="row">
      <label><input type="checkbox"> Lembrar-me</label>
      <a href="recuperar-senha.html">Esqueci a senha</a>
    </div>

    <button class="btn-primary" onclick="executarLogin()">Entrar</button>

    <p class="register">Não tem conta? <a href="cadastro-candidato.html">Criar conta</a></p>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="config.js"></script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }
    async function executarLogin() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      if (!email || !senha) { alert('Preencha o email e a senha.'); return; }
      const btn = document.querySelector('.btn-primary');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      try {
        const r = await fetch(API_URL + "/login", { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, senha}) });
        const d = await r.json();
        if (r.ok) { localStorage.setItem('token', d.token); localStorage.setItem('tipo', d.usuario?.tipo||''); localStorage.setItem('nome', d.usuario?.email||''); window.location.href = (d.usuario?.tipo === 'RH') ? 'rh-dashboard.html' : 'home.html'; }
        else { alert('Erro: ' + (d.mensagem || 'Credenciais inválidas.')); btn.disabled = false; btn.textContent = 'Entrar'; }
      } catch(e) { alert('Não foi possível conectar ao servidor.'); btn.disabled = false; btn.textContent = 'Entrar'; }
    }
  </script>
</body>
</html>
