<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Vagas</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-hover: rgba(255,255,255,0.16); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .topbar, body.high-contrast .vaga-card, body.high-contrast .search-wrap { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast input { background: #fff !important; color: #000 !important; }
    body.high-contrast .btn-apply { background: #ff0 !important; color: #000 !important; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); position: sticky; top: 0; z-index: 99; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .topbar-right { display: flex; gap: 10px; align-items: center; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }

    .container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }

    .page-header { margin-bottom: 28px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    .page-header h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .page-header p { font-size: 14px; color: var(--text-muted); }

    .search-wrap { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 12px; padding: 4px 4px 4px 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .search-wrap svg { width: 16px; height: 16px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
    .search-wrap input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; padding: 10px 0; }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap input:focus { outline: none; }

    .vagas { display: flex; flex-direction: column; gap: 14px; }

    .vaga-card { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 14px; padding: 22px; transition: 0.2s; }
    .vaga-card:hover { background: var(--white-hover); }

    .vaga-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .vaga-card h2 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; }
    .vaga-empresa { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .vaga-desc { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.8); margin-bottom: 14px; }

    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tag { font-size: 12px; font-weight: 500; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; }

    .btn-apply { background: var(--orange); border: none; color: #fff; padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-apply:hover { background: #e06b10; }

    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-top: 28px; transition: 0.2s; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <div class="topbar-right">
      <button class="btn-ghost" onclick="toggleContrast()">Alto Contraste</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <div class="page-label">Oportunidades</div>
      <h1>Vagas disponíveis</h1>
      <p>Explore oportunidades inclusivas</p>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="busca" placeholder="Pesquisar por cargo ou descrição...">
    </div>

    <div style="display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap">
      <select id="filtro-deficiencia" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:9px 14px;font-size:13px;font-family:Inter,sans-serif;cursor:pointer">
        <option value="">Todas as deficiências</option>
        <option value="Física">Física</option>
        <option value="Auditiva">Auditiva</option>
        <option value="Visual">Visual</option>
        <option value="Intelectual">Intelectual</option>
        <option value="Múltipla">Múltipla</option>
        <option value="Qualquer">Qualquer</option>
      </select>
      <select id="filtro-modelo" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:9px 14px;font-size:13px;font-family:Inter,sans-serif;cursor:pointer">
        <option value="">Todos os modelos</option>
        <option value="Presencial">Presencial</option>
        <option value="Híbrido">Híbrido</option>
        <option value="Remoto">Remoto</option>
      </select>
      <button onclick="aplicarFiltros()" style="background:#f47c20;border:none;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Filtrar</button>
      <button onclick="limparFiltros()" style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer">Limpar</button>
    </div>

    <div class="vagas" id="lista-vagas">
      <p style="color:rgba(255,255,255,0.6);font-size:14px">Carregando vagas...</p>
    </div>

    <a href="home.html" class="back">← Voltar para Home</a>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }

    let todasVagas = [];

    function renderVagas(vagas) {
      const lista = document.getElementById('lista-vagas');
      if (!vagas.length) { lista.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px">Nenhuma vaga encontrada.</p>'; return; }
      lista.innerHTML = vagas.map(v => {
        const tags = v.requisitos ? v.requisitos.split(',').map(r => `<span class="tag">${r.trim()}</span>`).join('') : '';
        return `<div class="vaga-card">
          <div class="vaga-top"><h2>${v.titulo}</h2>${v.modelo_trabalho ? `<span class="tag">${v.modelo_trabalho}</span>` : ''}</div>
          <p class="vaga-empresa">${v.localizacao || ''} ${v.nome_empresa ? '· ' + v.nome_empresa : ''}</p>
          <p class="vaga-desc">${v.descricao || ''}</p>
          ${v.tipo_deficiencia_foco ? `<p style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:12px">Foco: ${v.tipo_deficiencia_foco}</p>` : ''}
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          <button class="btn-apply" onclick="candidatar(${v.id})">Candidatar-se</button>
        </div>`;
      }).join('');
    }

    async function aplicarFiltros() {
      const busca = document.getElementById('busca').value;
      const deficiencia = document.getElementById('filtro-deficiencia').value;
      const modelo = document.getElementById('filtro-modelo').value;
      const params = new URLSearchParams();
      if (busca) params.append('busca', busca);
      if (deficiencia) params.append('deficiencia', deficiencia);
      if (modelo) params.append('modelo', modelo);
      try {
        const r = await fetch('http://localhost:3000/vagas/filtro?' + params.toString());
        const d = await r.json();
        renderVagas(r.ok ? d : []);
      } catch(e) { document.getElementById('lista-vagas').innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px">Erro de conexão.</p>'; }
    }

    function limparFiltros() {
      document.getElementById('busca').value = '';
      document.getElementById('filtro-deficiencia').value = '';
      document.getElementById('filtro-modelo').value = '';
      carregarVagas();
    }

    async function carregarVagas() {
      try {
        const r = await fetch('http://localhost:3000/vagas');
        const d = await r.json();
        todasVagas = r.ok ? d : [];
        renderVagas(todasVagas);
      } catch(e) { document.getElementById('lista-vagas').innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px">Não foi possível conectar ao servidor.</p>'; }
    }

    async function candidatar(vagaId) {
      const token = localStorage.getItem('token');
      if (!token) { alert('Você precisa estar logado.'); window.location.href = 'login.html'; return; }
      try {
        const r = await fetch('http://localhost:3000/inscricoes', { method: 'POST', headers: {'Content-Type':'application/json','Authorization':'Bearer '+token}, body: JSON.stringify({vaga_id: vagaId}) });
        const d = await r.json();
        alert(r.ok ? 'Candidatura realizada com sucesso!' : 'Erro: ' + (d.mensagem || 'Tente novamente.'));
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }

    document.getElementById('busca').addEventListener('keydown', e => { if (e.key === 'Enter') aplicarFiltros(); });
    carregarVagas();
  </script>
</body>
</html>
