<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Cadastro RH</title>
  <style>
    *{ margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body{ width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f5f7fc; overflow-x: hidden; position: relative; transition: 0.3s; padding: 40px 0; color: #1a2744; }
    body.high-contrast{ background: black; }
    body.high-contrast .register-card{ background: #111; border: 2px solid yellow; }
    body.high-contrast input, body.high-contrast select{ background: white; color: black; }
    body.high-contrast label, body.high-contrast .subtitle, body.high-contrast .login-link, body.high-contrast .contrast-btn{ color: yellow; }
    body.high-contrast .register-btn{ background: yellow; color: black; }
    .contrast-btn{ position: absolute; top: 18px; right: 18px; padding: 10px 22px; border-radius: 30px; border: 2px solid rgba(26,39,68,0.2); background: transparent; color: #1a2744; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .register-card{ width: 380px; background: #ffffff; border-radius: 20px; padding: 35px 30px; box-shadow: 0 4px 24px rgba(26,39,68,0.1); color: #1a2744; border: 1px solid rgba(26,39,68,0.1); }
    .logo-box{ width: 135px; height: 135px; margin: 0 auto 18px; background: #f5f5f5; border-radius: 18px; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .logo-box img{ width: 100%; height: 100%; object-fit: cover; }
    .subtitle{ text-align: center; font-size: 15px; margin-bottom: 25px; }
    .input-group{ margin-bottom: 18px; }
    .input-group label{ display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
    .input-group input{ width: 100%; height: 45px; border: none; border-radius: 10px; background: #e9edf2; padding: 0 14px; font-size: 15px; }
    .input-group input:focus{ outline: none; }
    .register-btn{ width: 100%; height: 50px; border: none; border-radius: 12px; background: #ff8400; color: white; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    .register-btn:hover{ background: #ff9500; transform: scale(1.01); }
    .login-link{ margin-top: 22px; text-align: center; font-size: 15px; font-weight: bold; }
    .login-link a{ color: #ffb347; }
    @media(max-width: 500px){ .register-card{ width: 90%; padding: 30px 25px; } }
  </style>
</head>
<body>

  <button class="contrast-btn" onclick="toggleContrast()">🌙 Alto Contraste</button>

  <div class="register-card">

    <div class="logo-box">
      <img src="logo.png.jpeg" alt="Logo Inclui+">
    </div>

    <p class="subtitle">Crie sua conta como <strong>Recursos Humanos</strong></p>

    <div class="input-group">
      <label>Nome completo</label>
      <input type="text" id="nome_completo" placeholder="Digite seu nome">
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Digite seu email">
    </div>

    <div class="input-group">
      <label>Nome da empresa</label>
      <input type="text" id="nome_fantasia" placeholder="Nome da empresa">
    </div>

    <div class="input-group">
      <label>CNPJ</label>
      <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
    </div>

    <div class="input-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Crie sua senha">
    </div>

    <div class="input-group">
      <label>Confirmar senha</label>
      <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">
    </div>

    <div style="margin-bottom:16px;display:flex;align-items:flex-start;gap:10px">
      <input type="checkbox" id="lgpd" style="margin-top:3px;width:16px;height:16px;flex-shrink:0;accent-color:#f47c20">
      <label for="lgpd" style="font-size:13px;line-height:1.5;color:#1a2744">
        Li e aceito a <strong>Política de Privacidade</strong> e o tratamento dos dados conforme a <strong>LGPD — Lei nº 13.709/2018</strong>.
      </label>
    </div>

    <button class="register-btn" type="button" onclick="executarCadastroRH()">
      Criar conta
    </button>

    <p class="login-link">
      Já possui conta? <a href="login.html">Entrar</a>
    </p>

  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="config.js"></script>
  <script src="topbar.js"></script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
  if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');

  function toggleContrast() {
    document.body.classList.toggle("high-contrast");
  }

  async function executarCadastroRH() {
    const nome_completo = document.getElementById('nome_completo').value;
    const email = document.getElementById('email').value;
    const nome_fantasia = document.getElementById('nome_fantasia').value;
    const cnpj = document.getElementById('cnpj').value;
    const senha = document.getElementById('senha').value;
    const confirmarSenha = document.getElementById('confirmarSenha').value;

    if (!nome_completo || !email || !nome_fantasia || !cnpj || !senha) {
      alert('Preencha todos os campos obrigatórios.');
      return;
    }

    if (!document.getElementById('lgpd').checked) {
      alert('Você precisa aceitar a LGPD.');
      return;
    }

    if (senha !== confirmarSenha) {
      alert('As senhas não coincidem!');
      return;
    }

    try {
      const resposta = await fetch(`${window.API_URL}/usuarios/rh`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          nome_completo,
          email,
          senha,
          nome_fantasia,
          cnpj
        })
      });

      let resultado;

      try {
        resultado = await resposta.json();
      } catch (e) {
        const texto = await resposta.text();
        console.log("RESPOSTA NÃO JSON:", texto);
        throw new Error("Backend não retornou JSON válido");
      }

      console.log("STATUS:", resposta.status);
      console.log("RESPOSTA:", resultado);

      if (resposta.ok) {
        const uid = resultado.usuario_id || resultado.usuario?.id;
        window.location.href = `confirmar-email.html?id=${uid}&email=${encodeURIComponent(email)}`;
      } else {
        alert('Erro ao cadastrar: ' + (resultado.mensagem || 'Verifique os dados.'));
      }

    } catch (e) {
      console.error(e);
      alert('Não foi possível conectar ao servidor.');
    }
  }

  // máscara CNPJ
  document.getElementById('cnpj').addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '').slice(0, 14);
    v = v.replace(/^(\d{2})(\d)/, '$1.$2');
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
    v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
    v = v.replace(/(\d{4})(\d)/, '$1-$2');
    this.value = v;
  });
</script>
