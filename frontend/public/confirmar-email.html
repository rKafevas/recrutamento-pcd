<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Confirmar E-mail</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f7fc; color: #1a2744; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 400px; background: #ffffff; border: 1px solid rgba(26,39,68,0.1); border-radius: 18px; padding: 36px 32px; box-shadow: 0 4px 24px rgba(26,39,68,0.08); }
    .icon { width: 56px; height: 56px; background: rgba(244,124,32,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .icon svg { width: 26px; height: 26px; stroke: #f47c20; fill: none; stroke-width: 2; stroke-linecap: round; }
    h1 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #6b7a99; text-align: center; margin-bottom: 28px; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field input { width: 100%; background: #f8f9fd; border: 1px solid rgba(26,39,68,0.14); border-radius: 9px; padding: 11px 14px; font-size: 15px; color: #1a2744; font-family: 'Inter', sans-serif; letter-spacing: 6px; text-align: center; }
    .field input::placeholder { letter-spacing: 0; color: rgba(26,39,68,0.35); }
    .field input:focus { outline: none; border-color: #1e74df; background: #ffffff; }
    .btn { width: 100%; height: 46px; background: #f47c20; border: none; color: #fff; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn:hover { background: #e06b10; }
    .resend { text-align: center; margin-top: 16px; font-size: 13px; color: #6b7a99; }
    .resend button { background: none; border: none; color: #f47c20; font-size: 13px; cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
    <h1>Confirme seu e-mail</h1>
    <p class="sub" id="sub-texto">Enviamos um código de 6 dígitos para o seu e-mail. Digite-o abaixo para ativar sua conta.</p>

    <div class="field">
      <label>Código de verificação</label>
      <input type="text" id="codigo" placeholder="000000" maxlength="6">
    </div>

    <button class="btn" onclick="confirmar()">Confirmar e-mail</button>

    <div class="resend">
      Não recebeu? <button onclick="reenviar()">Reenviar código</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="topbar.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const usuarioId = params.get('id');
    const email = params.get('email');
    if (email) document.getElementById('sub-texto').textContent = `Enviamos um código de 6 dígitos para ${email}. Digite-o abaixo para ativar sua conta.`;

    async function confirmar() {
      const codigo = document.getElementById('codigo').value.trim();
      if (codigo.length !== 6) { alert('Digite o código de 6 dígitos.'); return; }
      try {
        const r = await fetch(API_URL + '/confirmar-email', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ usuario_id: usuarioId, token: codigo })
        });
        const d = await r.json();
        if (r.ok) { alert('E-mail confirmado! Agora você pode fazer login.'); window.location.href = 'login.html'; }
        else alert('Erro: ' + (d.mensagem || 'Código inválido.'));
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }

    async function reenviar() {
      alert('Um novo código foi enviado para o seu e-mail.');
    }
  </script>
</body>
</html>
