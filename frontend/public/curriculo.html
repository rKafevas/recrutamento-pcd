<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Currículo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; padding-bottom: 48px; }
    .container { max-width: 640px; margin: 0 auto; padding: 40px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
    .panel { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 16px; padding: 28px; margin-bottom: 16px; }
    .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 18px; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 11px 14px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; transition: 0.2s; }
    .field input:focus, .field textarea:focus { outline: none; border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); }
    .field textarea { min-height: 100px; resize: vertical; }
    .btn-primary { background: var(--orange); border: none; color: #fff; padding: 12px 24px; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #e06b10; }
    .btn-danger { background: transparent; border: 1px solid rgba(248,113,113,0.4); color: #f87171; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-top: 20px; }
    .curriculo-atual { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .curriculo-atual a { font-size: 12px; font-weight: 600; color: #4ade80; text-decoration: none; }
    .file-area { border: 1px dashed rgba(255,255,255,0.25); border-radius: 10px; padding: 24px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="page-label">Perfil</div>
    <h1>Meu Currículo</h1>
    
    <div class="panel" style="display:flex;align-items:center;gap:20px">
      <div id="foto-preview" style="width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden"></div>
      <div style="flex:1">
        <label style="background:var(--orange);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer">
          Alterar foto
          <input type="file" id="arquivo-foto" accept=".jpg,.jpeg,.png,.webp" style="display:none" onchange="enviarFoto(this)">
        </label>
        <button id="btn-remover-foto" onclick="removerFoto()" style="display:none;background:transparent;border:1px solid rgba(248,113,113,0.4);color:#f87171;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer">Remover</button>
      </div>
    </div>

    <div class="panel">
      <div class="field"><label>Nome completo</label><input type="text" id="nome"></div>
      <div class="field"><label>E-mail</label><input type="email" id="email" disabled style="opacity:0.6"></div>
      <div class="field"><label>Telefone</label><input type="text" id="telefone"></div>
      <div class="field"><label>Sobre você</label><textarea id="sobre"></textarea></div>
      <button class="btn-primary" onclick="salvarInfos()">Salvar informações</button>
    </div>

    <div class="panel">
      <div class="panel-title">Formação e Habilidades</div>
      <div class="field"><textarea id="formacao" placeholder="Formação"></textarea></div>
      <div class="field"><textarea id="experiencias" placeholder="Experiências"></textarea></div>
      <div class="field"><textarea id="habilidades" placeholder="Habilidades"></textarea></div>
    </div>

    <div class="panel">
      <div id="curriculo-atual" style="display:none" class="curriculo-atual">
        <div><p>Currículo anexado</p><a id="link-curriculo" href="#" target="_blank">Visualizar</a></div>
        <button class="btn-danger" onclick="removerCurriculo()">Remover</button>
      </div>
      <div id="upload-area" class="file-area">
        <input type="file" id="arquivo-curriculo" accept=".pdf">
      </div>
      <button class="btn-primary" style="margin-top:16px" onclick="salvarCurriculo()">Enviar currículo</button>
    </div>

    <a href="home.html" class="back">← Voltar para Home</a>
  </div>

  <script src="config.js"></script>
  <script src="toast.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    async function carregarPerfil() {
      try {
        const r = await fetch(API_URL + "/perfil", { headers: {'Authorization':'Bearer '+token} });
        const d = await r.json();
        if (!r.ok) return;
        if (d.nome_completo) document.getElementById('nome').value = d.nome_completo;
        if (d.email) document.getElementById('email').value = d.email;
        if (d.telefone) document.getElementById('telefone').value = d.telefone;
        if (d.sobre) document.getElementById('sobre').value = d.sobre;
        if (d.foto_url) {
          document.getElementById('foto-preview').innerHTML = `<img src="${API_URL}/${d.foto_url.replace(/\\/g,'/')}" style="width:100%;height:100%;object-fit:cover">`;
          document.getElementById('btn-remover-foto').style.display = 'block';
        }
        if (d.formacao) document.getElementById('formacao').value = d.formacao;
        if (d.experiencias) document.getElementById('experiencias').value = d.experiencias;
        if (d.habilidades) document.getElementById('habilidades').value = d.habilidades;
        if (d.curriculo_url) {
          document.getElementById('curriculo-atual').style.display = 'flex';
          document.getElementById('upload-area').style.display = 'none';
          document.getElementById('link-curriculo').href = API_URL + '/' + d.curriculo_url.replace(/\\/g, '/');
        }
      } catch(e) { console.error(e); }
    }

    async function enviarFoto(input) {
      const arquivo = input.files[0];
      if (!arquivo) return;
      const formData = new FormData();
      formData.append('foto', arquivo);
      try {
        const r = await fetch(API_URL + "/perfil/foto", { method: 'PATCH', headers: {'Authorization':'Bearer '+token}, body: formData });
        if (r.ok) { Toast.show('Foto atualizada!', 'success'); carregarPerfil(); }
      } catch(e) { Toast.show('Erro de conexão.', 'error'); }
    }

    async function salvarInfos() {
      const dados = {
        nome: document.getElementById('nome').value,
        sobre: document.getElementById('sobre').value,
        telefone: document.getElementById('telefone').value,
        formacao: document.getElementById('formacao').value,
        experiencias: document.getElementById('experiencias').value,
        habilidades: document.getElementById('habilidades').value
      };
      try {
        const r = await fetch(API_URL + "/perfil/infos", {
          method: 'PATCH',
          headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
          body: JSON.stringify(dados)
        });
        if (r.ok) Toast.show('Informações salvas!', 'success');
      } catch(e) { Toast.show('Erro ao conectar.', 'error'); }
    }

    async function salvarCurriculo() {
      const arquivo = document.getElementById('arquivo-curriculo').files[0];
      if (!arquivo) return Toast.show('Selecione um PDF.', 'warning');
      const formData = new FormData();
      formData.append('curriculo', arquivo);
      try {
        const r = await fetch(API_URL + "/perfil/curriculo", { method: 'PATCH', headers: {'Authorization':'Bearer '+token}, body: formData });
        if (r.ok) { Toast.show('Currículo enviado!', 'success'); carregarPerfil(); }
      } catch(e) { Toast.show('Erro ao enviar.', 'error'); }
    }

    carregarPerfil();
  </script>
</body>
</html>
