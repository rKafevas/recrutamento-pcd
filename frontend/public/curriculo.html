<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclui+ | Currículo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --orange: #f47c20; --white-med: rgba(255,255,255,0.10); --white-border: rgba(255,255,255,0.15); --text-muted: rgba(255,255,255,0.65); }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0d3b8e 0%, #1e74df 100%); color: #fff; min-height: 100vh; padding-bottom: 48px; }
    body.high-contrast { background: #000 !important; color: #ff0 !important; }
    body.high-contrast .topbar, body.high-contrast .panel { background: #111 !important; border: 2px solid #ff0 !important; }
    body.high-contrast input, body.high-contrast textarea { background: #fff !important; color: #000 !important; }
    body.high-contrast .btn-primary { background: #ff0 !important; color: #000 !important; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(13,59,142,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--white-border); position: sticky; top: 0; z-index: 99; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .logo span { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-ghost { background: transparent; border: 1px solid var(--white-border); color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }

    .container { max-width: 640px; margin: 0 auto; padding: 40px 24px; }
    .page-label { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); margin-bottom: 6px; }
    h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }

    .panel { background: var(--white-med); border: 1px solid var(--white-border); border-radius: 16px; padding: 28px; margin-bottom: 16px; }
    .panel-title { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 18px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 11px 14px; font-size: 14px; color: #fff; font-family: 'Inter', sans-serif; transition: 0.2s; }
    .field input::placeholder, .field textarea::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus, .field textarea:focus { outline: none; border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); }
    .field textarea { min-height: 100px; resize: vertical; }

    .file-area { border: 1px dashed rgba(255,255,255,0.25); border-radius: 10px; padding: 24px; text-align: center; }
    .file-area p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    .file-area input { color: rgba(255,255,255,0.7); font-size: 13px; }

    .btn-primary { background: var(--orange); border: none; color: #fff; padding: 12px 24px; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #e06b10; }

    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 14px; margin-top: 20px; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><img src="logo.png.jpeg" alt="Inclui+"><span>Inclui+</span></div>
    <button class="btn-ghost" onclick="toggleContrast()">Alto Contraste</button>
  </div>

  <div class="container">
    <div class="page-label">Perfil</div>
    <h1>Meu Currículo</h1>
    <p class="sub">Atualize suas informações profissionais</p>

    <div class="panel">
      <div class="panel-title">Informações pessoais</div>
      <div class="field"><label>Nome completo</label><input type="text" placeholder="Seu nome"></div>
      <div class="field"><label>E-mail</label><input type="email" placeholder="seu@email.com"></div>
      <div class="field"><label>Telefone</label><input type="text" placeholder="(00) 00000-0000"></div>
      <div class="field"><label>Sobre você</label><textarea placeholder="Fale sobre suas experiências e habilidades"></textarea></div>
    </div>

    <div class="panel">
      <div class="panel-title">Currículo em PDF</div>
      <div class="file-area">
        <p>Selecione o arquivo do seu currículo</p>
        <input type="file" accept=".pdf">
      </div>
    </div>

    <button class="btn-primary" onclick="salvarCurriculo()">Salvar currículo</button>
    <br>
    <a href="home.html" class="back">← Voltar para Home</a>
  </div>

  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    function toggleContrast(){ document.body.classList.toggle('high-contrast'); }
    async function salvarCurriculo() {
      const token = localStorage.getItem('token');
      if (!token) { alert('Você precisa estar logado.'); window.location.href = 'login.html'; return; }
      const arquivo = document.querySelector('input[type="file"]').files[0];
      if (!arquivo) { alert('Selecione um arquivo PDF.'); return; }
      const formData = new FormData();
      formData.append('curriculo', arquivo);
      const nome = document.querySelector('input[type="text"]')?.value;
      const sobre = document.querySelector('textarea')?.value;
      if (nome) formData.append('nome', nome);
      if (sobre) formData.append('sobre', sobre);
      try {
        const r = await fetch('http://localhost:3000/perfil/curriculo', { method: 'PATCH', headers: {'Authorization':'Bearer '+token}, body: formData });
        const d = await r.json();
        alert(r.ok ? 'Currículo salvo!' : 'Erro: ' + (d.mensagem || 'Tente novamente.'));
      } catch(e) { alert('Não foi possível conectar ao servidor.'); }
    }
  </script>
</body>
</html>
